<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水晶机巧 · 从基础到实战</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f9,#171a20);--fg:light-dark(#202b39,#edf0f6);--muted:light-dark(#526073,#b4bfd0);--line:light-dark(#d8dfe8,#3b4454);--accent:light-dark(#246355,#83d8bd);--panel:light-dark(#fff,#212733)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}header{padding:32px max(24px,calc((100vw - 1300px)/2));border-bottom:1px solid var(--line)}h1{font-size:30px;margin:0 0 8px}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;margin:24px 0 8px}p{margin:8px 0}.muted{color:var(--muted)}.wrap{max-width:1348px;margin:auto;padding:24px;display:grid;grid-template-columns:270px 1fr;gap:32px}aside{position:sticky;top:20px;align-self:start}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:650}select,input{width:100%;margin-bottom:12px}#lessons{max-height:65vh;overflow:auto;display:grid;gap:6px}#lessons button{text-align:left;font-size:14px}main{min-width:0}.tag{display:inline-block;color:var(--accent);font-size:14px;margin:0 16px 8px 0}.states{display:grid;grid-template-columns:1fr 1fr;gap:24px}.zone{padding:10px 0;border-bottom:1px solid var(--line)}.zone b{font-size:14px;color:var(--muted);display:block}.card{padding:1px 0;border:0;border-radius:0;background:transparent;text-align:left;color:var(--accent)}.notes{padding:14px 18px;background:var(--panel);border-left:3px solid var(--accent);margin:16px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row select{width:auto;margin:0}details{padding:12px 0;border-top:1px solid var(--line)}summary{cursor:pointer;font-weight:600}ol{padding-left:28px}li{padding:3px 0}.hash{font-family:monospace;overflow-wrap:anywhere;font-size:12px}#cardText{white-space:pre-wrap}dialog{max-width:650px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:24px}dialog::backdrop{background:#0008}footer{font-size:13px;color:var(--muted);margin-top:28px}@media(max-width:800px){.wrap{grid-template-columns:1fr;padding:16px}aside{position:static}#lessons{max-height:200px}.states{grid-template-columns:1fr}h1{font-size:25px}header{padding:24px 16px}}
</style></head><body>
<header><h1>水晶机巧 · 从基础到实战</h1><p class="muted">先看启动条件，再看资源变化，最后回到真实起手和对手场面。</p></header>
<div class="wrap"><aside><label for="group">学习层级</label><select id="group"><option value="foundation">① 单卡基础</option><option value="derivation">② 双卡衍生</option><option value="natural">③ 录像原始起手</option><option value="board_break">④ 移除场上目标</option><option value="battle">⑤ 攻击与压低生命值</option><option value="recovery">⑥ 对手响应后的接续</option><option value="postbattle">⑦ 战后保留资源</option></select><label for="search">查找启动牌或题目</label><input id="search" placeholder="输入卡名或编号"><div id="lessons"></div></aside><main id="content"></main></div>
<dialog id="cardDialog"><h2 id="cardName"></h2><p id="cardText"></p><button id="closeCard">关闭</button></dialog>
<script id="course-data" type="application/json">__COURSE_DATA__</script><script>
const D=JSON.parse(document.getElementById('course-data').textContent),$=id=>document.getElementById(id);
const labels={foundation:'单卡基础',derivation:'双卡衍生',natural:'原始起手迁移',board_break:'移除场上目标',battle:'攻击与压血',recovery:'对手响应后的接续',postbattle:'战后资源'};
const verbs={Summon:'通常召唤',SpSummon:'特殊召唤',Activate:'发动',Set:'盖放',MSet:'里侧守备放置',Select:'选择',Cancel:'不发动／取消',Attack:'攻击',Reposition:'改变表示形式',None:'阶段或选择操作'};
const zones={2:'手牌',4:'怪兽区',8:'魔法与陷阱区',16:'墓地',32:'除外'};
let active=null;
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function name(id){return D.cards[id]?.name||String(id);}
function card(id){return `<button class="card" data-card="${id}">${esc(name(id))}</button>`;}
function title(c){const hand=c.start.cards.filter(x=>x.player===c.seat&&x.location===2).map(x=>name(x.code));return c.group==='foundation'||c.group==='derivation'?hand.join(' ＋ '):`${c.group==='board_break'?'处理'+name(c.goal.code):c.group==='battle'?'攻击并压到 '+c.goal.opponent_lp_at_most+' LP':labels[c.group]} · ${c.ordinal}`;}
function field(state,seat,opponent=false){return Object.entries(zones).map(([z,label])=>{let cards=state.cards.filter(x=>x.player===seat&&x.location===Number(z));if(opponent&&Number(z)===2)return '';let counts={};for(const c of cards){const hidden=opponent&&[4,8].includes(Number(z))&&!(c.position&5);const key=hidden?'hidden':c.code;counts[key]=(counts[key]||0)+1;}return `<div class="zone"><b>${label}</b>${Object.entries(counts).map(([code,n])=>(code==='hidden'?'里侧卡片':card(code))+(n>1?' × '+n:'')).join('、')||'无'}</div>`;}).join('');}
function goal(c){let g=c.goal;if(g.kind==='settled_resource_inventory')return '在本回合内形成所列资源分布。具体卡片、所在区域与数量均须达到要求。';if(g.kind==='remove_public_threat')return `使对手场上的「${name(g.code)}」数量不超过 ${g.max_remaining}。这是移除指定目标题，未要求清空全部场面。`;if(['battle_damage','attack_and_lp_reduction'].includes(g.kind))return `本回合完成至少一次攻击，并将对手生命值压到 ${g.opponent_lp_at_most} 或以下。生命值减少可能同时包含效果伤害。`;if(g.kind==='postbattle_resources')return `完成攻击后进入主要阶段二，保留至少 ${g.min_resources} 张手牌与表侧怪兽合计资源。`;return '对手响应后的既定局面中，继续展开到所列怪兽资源；起点尚未满足该目标。不据此认定已经学会抗干扰。';}
function action(d){let a=d.action;return `${d.player===active.seat?'我方':'对手'} · ${esc(a.act==='None'?(a.code?'选择卡片':d.message===18?'选择表示形式':d.message===19?'选择放置区域':'确认选择'):verbs[a.act]||a.act)} ${a.code?card(a.code):''}${a.finish?' · 完成选择':''}${a.phase&&a.phase!=='None'?' · '+esc(a.phase):''}`;}
function show(c){active=c;const pure=['foundation','derivation'].includes(c.group);$('content').innerHTML=`<span class="tag">${labels[c.group]}</span><span class="tag">${c.split==='fit'?'训练示范':'留出样本'}</span><h2>${esc(title(c))}</h2><p>${esc(goal(c))}</p><div class="notes">${pure?'限定起手仅包含上面列出的启动牌；我方初始场上、墓地、除外区为空。牌库与额外牌组仍是原录像配置，固定牌序，未测试对手主动干扰。':'保留原录像前缀与真实资源；模型从题目起点接手。对手后续按固定被动策略选择，不能据此推断对强对手的胜率。'}${c.id.includes('grass')?' 割草路线额外依赖双方牌库数量差和堆墓结果。':''}</div><div class="states"><section><h3>题目起点 · 我方</h3>${field(c.start,c.seat)}</section><section><h3>示范终点 · 我方</h3>${field(c.end,c.seat)}</section></div>${!pure?`<details><summary>起点的对手公开资源</summary>${field(c.start,1-c.seat,true)}</details>`:''}${c.stages.length?`<h3>逐段查看资源变化</h3><div class="row"><label for="stage">操作边界</label><select id="stage">${c.stages.map((s,i)=>`<option value="${i}">第 ${s.step} 个环境操作后</option>`).join('')}</select></div><div id="stageState"></div>`:''}<details><summary>展开示范操作（${c.actions.length} 次环境选择）</summary><p class="muted">包含选卡、选位置、连锁确认等细分操作；不等于同样数量的组合机制。</p><ol start="${c.root+1}">${c.actions.map(d=>`<li>${action(d)}</li>`).join('')}</ol></details><details><summary>范围与来源</summary><p>来源录像指纹：</p><p class="hash">${c.source}</p><p>完整合法历史已重建；准入数据经过独立引擎端点复核。此页展示示范，未把示范完成率当成模型成功率。</p></details><footer>卡名与效果来自本次固定的本地卡库。点击卡名查看。单卡与双卡课程展示的是已验证路线片段，并不声称是完整 FTK 或该启动牌的最优路线。</footer>`;if($('stage')){$('stage').onchange=()=>{$('stageState').innerHTML=field(c.stages[Number($('stage').value)].state,c.seat);};$('stage').onchange();}document.querySelectorAll('#lessons button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));}
function list(){const group=$('group').value,q=$('search').value.trim();const cs=D.courses.filter(c=>c.group===group&&(!q||title(c).includes(q)||c.id.includes(q)||c.start.cards.some(x=>x.player===c.seat&&x.location===2&&name(x.code).includes(q))));$('lessons').innerHTML=cs.map(c=>`<button data-id="${c.id}" aria-pressed="false">${esc(title(c))}</button>`).join('')||'<p class="muted">这一层尚无已准入题目。</p>';if(cs.length)show(cs[0]);else $('content').innerHTML='<h2>等待验证后的课程</h2>';}
$('group').onchange=list;$('search').oninput=list;$('lessons').onclick=e=>{const b=e.target.closest('[data-id]');if(b)show(D.courses.find(c=>c.id===b.dataset.id));};document.addEventListener('click',e=>{const b=e.target.closest('[data-card]');if(!b)return;const c=D.cards[b.dataset.card];$('cardName').textContent=c?.name||b.dataset.card;$('cardText').textContent=c?.text||'未找到卡片说明';$('cardDialog').showModal();});$('closeCard').onclick=()=>$('cardDialog').close();list();
</script></body></html>
